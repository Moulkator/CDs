name: Compléter les durées

on:
  workflow_dispatch:          # lancement à la main uniquement (Actions → Run workflow)

permissions:
  contents: write

jobs:
  durees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fill_durees.py
      - name: Commit des durées
        run: |
          git config user.name "sorties-bot"
          git config user.email "sorties-bot@users.noreply.github.com"
          git add data/collection.json data/wishlist.json
          git diff --staged --quiet || git commit -m "Durées des albums complétées (Deezer)"
          git pull --rebase origin main
          git push
