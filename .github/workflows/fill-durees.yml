name: Compléter les durées

on:
  workflow_dispatch:          # lancement à la main uniquement (Actions → Run workflow)

permissions:
  contents: write

# une seule mise à jour des données à la fois (les autres attendent leur tour)
concurrency:
  group: donnees-du-site
  cancel-in-progress: false

jobs:
  durees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fill_durees.py
      - name: Commit des durées
        run: |
          git config user.name "sorties-bot"
          git config user.email "sorties-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Durées des albums complétées (Deezer)"
          # en cas de conflit avec une autre mise à jour, on garde les données qu'on vient de calculer
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
            git push && exit 0
            sleep 10
          done
          exit 1
