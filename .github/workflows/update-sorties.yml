name: Mise à jour des sorties

on:
  schedule:
    - cron: "17 4 * * *"      # ~6h17 Paris en été (5h17 en hiver)
    - cron: "17 16 * * *"     # second passage ~18h17, au cas où le premier saute
  workflow_dispatch:
  push:
    paths:
      - "data/watchlist-manuel.json"
      - "data/collection.json"
      - "data/wishlist.json"

permissions:
  contents: write

# une seule mise à jour des données à la fois (les autres attendent leur tour)
concurrency:
  group: donnees-du-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/update_sorties.py
      - name: Pochettes (copie locale)
        run: python scripts/mirror_covers.py
      - name: Concerts (Ticketmaster / Bandsintown)
        env:
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/update_concerts.py
      - name: Setlists (setlist.fm)
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: python scripts/update_setlists.py
      - name: Notifications Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          SITE_URL: https://moulkator.github.io/CDs/
        run: python scripts/notify_discord.py
      - name: Commit des données mises à jour
        run: |
          git config user.name "sorties-bot"
          git config user.email "sorties-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour automatique des sorties"
          # en cas de conflit avec une autre mise à jour, on garde les données qu'on vient de calculer
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
            git push && exit 0
            sleep 10
          done
          exit 1
