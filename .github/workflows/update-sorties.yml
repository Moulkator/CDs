name: Mise à jour des sorties

on:
  schedule:
    - cron: "17 4 * * *"      # chaque nuit à 04h17 UTC
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_sorties.py
      - name: Notifications Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SITE_URL: https://moulkator.github.io/CDs/
        run: python scripts/notify_discord.py
      - name: Commit des données mises à jour
        run: |
          git config user.name "sorties-bot"
          git config user.email "sorties-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour automatique des sorties"
          git pull --rebase origin main || (git rebase --abort; git pull --no-rebase origin main)
          git push
