name: Mise à jour des sorties

on:
  schedule:
    - cron: "17 4 * * *"      # ~6h17 Paris en été (5h17 en hiver)
    - cron: "17 16 * * *"     # second passage ~18h17, au cas où le premier saute
  workflow_dispatch:
  push:
    paths:
      - "data/watchlist-manuel.json"
      - "data/collection.json"
      - "data/wishlist.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_sorties.py
      - name: Concerts (Bandsintown)
        env:
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: python scripts/update_concerts.py
      - name: Notifications Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          SITE_URL: https://moulkator.github.io/CDs/
        run: python scripts/notify_discord.py
      - name: Commit des données mises à jour
        run: |
          git config user.name "sorties-bot"
          git config user.email "sorties-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour automatique des sorties"
          git pull --rebase origin main || (git rebase --abort; git pull --no-rebase origin main)
          git push
